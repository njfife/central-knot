name: First-look Mac package
on:
  push:
    branches: [next]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    runs-on: [self-hosted, macOS, ARM64, ck-mac]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:mac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Central-Knot-0.1.0-mac-arm64
          path: release/Central-Knot-0.1.0-mac-arm64.zip
          if-no-files-found: error
