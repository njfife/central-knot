name: First-look Mac package
on:
  push:
    branches: [next]
  workflow_dispatch:
permissions:
  contents: read
# One runner: a newer push to the same branch replaces the run it made out of date.
concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # A push to next whose tree a green run of this workflow already tested (a branch merged as it was tested) is not run again:
  # this job says which run tested it, and the Mac job is skipped. It reads GitHub only, on GitHub's runner, not the Mac.
  tested:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.find.outputs.run }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          TREE: ${{ github.event.head_commit.tree_id }}
        run: |
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/mac.yml/runs?status=success&per_page=100" \
            --jq "[.workflow_runs[] | select(.head_commit.tree_id == \"$TREE\")][0].html_url // empty")
          echo "run=$run" >> "$GITHUB_OUTPUT"
          said="No green run has tested this tree ($TREE)."
          [ -z "$run" ] || said="This tree ($TREE) was tested by $run: the Mac run is skipped."
          echo "$said" | tee -a "$GITHUB_STEP_SUMMARY"
  mac:
    needs: tested
    # Unless the job above found the tree tested; also when it did not run (a run asked for by hand) or could not say.
    if: ${{ !cancelled() && !needs.tested.outputs.run }}
    runs-on: [self-hosted, macOS, ARM64, ck-mac]
    # A run of PR #152 took about 9 minutes (2026-11-17): about 3 for its first phase, 6 for the end-to-end checks (the end of
    # scripts/mac-run.mjs's output gives each part's time). The limit leaves room for a slow one.
    timeout-minutes: 30
    env:
      # This run's temporary folder, under /private/tmp, which Spotlight doesn't index; the last step removes it however the run
      # ends. Each script makes its own folder inside it and hands the apps it opens their own (scripts/scratch.mjs).
      TMPDIR: /private/tmp/ck-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - run: mkdir -p "$TMPDIR"
      # An app left running by a cancelled or failed run would hold a debug port that this run could attach to.
      - run: pkill -f "$GITHUB_WORKSPACE/(release|node_modules/electron)/" || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          # No npm cache: this self-hosted runner keeps ~/.npm between runs, so restoring one only costs time.
      # The Mac is its owner's own computer: wait while it is short of memory, swap or disk, then fail plainly (its limits).
      - run: node scripts/mac-guard.ts
      - run: npm ci
      # Every check, in two phases: scripts/mac-run.mjs says what runs beside what and why, and ends with each part's time. exec:
      # the runner's stop (a newer push cancels this run) reaches the script itself, which sends it on to every part.
      - run: exec node scripts/mac-run.mjs
      # The light tour's pictures: gh run download <run> -n light-tour.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: light-tour
          path: light-tour
          if-no-files-found: ignore
          retention-days: 7
      # However the run ended: each process still running from the workspace or a run's temporary folder (by its command or its
      # environment) stopped by its id, each disk image attached from them detached, then this run's folder and any an earlier
      # run left removed, and release/ emptied. ps is listed to a file first, so this step's own shell and ps are told apart.
      - if: always()
        run: |
          ours() { awk -v a=/private/tmp/ck-ci- -v b="$GITHUB_WORKSPACE/" "$@"; }
          ps -axEww -o pid=,ppid=,command= > "$RUNNER_TEMP/ps.txt"
          alive=$(ours -v me=$$ '$1 != me && $2 != me && (index($0, a) || index($0, b)) { print $1 }' "$RUNNER_TEMP/ps.txt")
          for pid in $alive; do echo "still running, stopped: $(ps -o command= -p "$pid" | cut -c1-150)"; kill -9 "$pid" || true; done
          for disk in $(hdiutil info | ours '/^image-path/ { o = index($0, a) || index($0, b) } o && /^\/dev\/disk[0-9]+[ \t]/ { print $1; o = 0 }'); do
            hdiutil detach -force "$disk" > /dev/null && echo "detached $disk"; done
          folders=$(find /private/tmp -maxdepth 1 -name 'ck-ci-*' -user "$(id -un)")
          rm -rf $folders "$GITHUB_WORKSPACE/release"
          echo "removed $(echo $folders) and release/; $(echo $alive | wc -w | tr -d ' ') processes were still running"
