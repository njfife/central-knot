name: First-look Mac package
on:
  push:
    branches: [next]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    runs-on: [self-hosted, macOS, ARM64, ck-mac]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:mac
      - run: npm run e2e
