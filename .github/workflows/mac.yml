name: First-look Mac package
on:
  push:
    branches: [next]
  workflow_dispatch:
permissions:
  contents: read
# One runner: a newer push to the same branch replaces the run it made out of date.
concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # A push to next whose tree a green run of this workflow already tested (a branch merged as it was tested) is not run again:
  # this job says which run tested it, and the Mac job is skipped. It reads GitHub only, on GitHub's runner, not the Mac. If
  # it can't tell, the Mac job runs, and the workflow's result is the Mac job's.
  tested:
    if: github.event_name == 'push'
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.find.outputs.run }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          TREE: ${{ github.event.head_commit.tree_id }}
        run: |
          said="No green run has tested this tree ($TREE)."
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/mac.yml/runs?status=success&per_page=100" \
            --jq "[.workflow_runs[] | select(.head_commit.tree_id == \"$TREE\")][0].html_url // empty") || { run=; said="The lookup failed: the Mac run goes ahead."; }
          echo "run=$run" >> "$GITHUB_OUTPUT"
          [ -z "$run" ] || said="This tree ($TREE) was tested by $run: the Mac run is skipped."
          echo "$said" | tee -a "$GITHUB_STEP_SUMMARY"
  mac:
    needs: tested
    # Unless the job above found the tree tested; also when it did not run (a run asked for by hand) or could not say.
    if: ${{ !cancelled() && !needs.tested.outputs.run }}
    runs-on: [self-hosted, macOS, ARM64, ck-mac]
    # The guard may wait 10 minutes for room, a passing run took about 20 (run 44880740815, 2026-11-21; the end of
    # scripts/mac-run.mjs's output gives each part's time), and the rest is for a slow run and the clean-up.
    timeout-minutes: 45
    env:
      # This run's temporary folder, under /private/tmp, which Spotlight doesn't index; the last step removes it however the run
      # ends. Each script makes its own folder inside it and hands the apps it opens their own (scripts/scratch.ts).
      TMPDIR: /private/tmp/ck-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - run: mkdir -p "$TMPDIR"
      # An app left running by a cancelled or failed run would hold a debug port that this run could attach to.
      - run: pkill -f "$GITHUB_WORKSPACE/(release|node_modules/electron)/" || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          # No npm cache: this self-hosted runner keeps ~/.npm between runs, so restoring one only costs time.
      # The Mac is its owner's own computer: wait while it is short of memory, swap or disk, then fail plainly (its limits).
      - run: node scripts/mac-guard.ts
      - run: npm ci
      # Every check, in two phases: scripts/mac-run.mjs says what runs beside what and why, and ends with each part's time. exec:
      # the runner's stop (a newer push cancels this run) reaches the script itself, which sends it on to every part.
      - run: exec node scripts/mac-run.mjs
      # The light tour's pictures: gh run download <run> -n light-tour.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: light-tour
          path: light-tour
          if-no-files-found: ignore
          retention-days: 7
      # However the run ended, only what runs made goes, each failure said and making the step red. A run's process is this
      # user's, not this step's shell or an ancestor, and runs from the checkout's release/ or node_modules/electron/ or shows the
      # job's TMPDIR=/private/tmp/ck-ci-<digits>-<digits>. Its one known limit: macOS shows a process's arguments and environment
      # as one string, so a process of this user with that whole word among its arguments is taken for a run's. A run's folder is
      # a directory of this user's directly in /private/tmp named ck-ci-<digits>-<digits>; a run's image lies under one or under
      # the checkout. Processes are stopped, images detached, then the folders and release/ made writable (a flow leaves a
      # read-only folder) and removed, but for one that holds an image that would not detach.
      - if: always()
        run: |
          ws=$GITHUB_WORKSPACE user=$(id -un) red=0 removed= kept=()
          case $ws in /?*) ;; *) echo "GITHUB_WORKSPACE is '$ws', not an absolute folder other than /: nothing was cleaned"; exit 1;; esac
          ps -axEww -o pid=,ppid=,user=,command= > "$RUNNER_TEMP/ps.txt" || { echo "could not list the processes"; red=1; }
          for pid in $(awk -v me=$$ -v user="$user" -v ws="$ws" '{ parent[$1] = $2; owner[$1] = $3; c = $0; sub(/^ *[0-9]+ +[0-9]+ +[^ ]+ +/, "", c); cmd[$1] = c }
            END { for (p = me; p in parent && !(p in spared); p = parent[p]) spared[p] = 1
              for (p in cmd) if (owner[p] == user && !(p in spared) && parent[p] != me && ((" " cmd[p] " ") ~ / TMPDIR=\/private\/tmp\/ck-ci-[0-9]+-[0-9]+[\/ ]/ ||
                index(cmd[p], ws "/release/") == 1 || index(cmd[p], ws "/node_modules/electron/") == 1)) print p }' "$RUNNER_TEMP/ps.txt"); do
            what=$(ps -o command= -p "$pid" | cut -c1-150)
            if [ -z "$what" ]; then continue; elif kill -9 "$pid" 2> /dev/null; then echo "still running, stopped: $what"
            elif ps -p "$pid" > /dev/null; then echo "still running, not stopped: $what"; red=1; fi
          done
          find /private/tmp -mindepth 1 -maxdepth 1 -type d -user "$user" -name 'ck-ci-*' -print0 > "$RUNNER_TEMP/found" || { echo "could not list /private/tmp"; red=1; }
          while IFS= read -r -d '' folder; do [[ ${folder##*/} =~ ^ck-ci-[0-9]+-[0-9]+$ ]] && echo "$folder"; done < "$RUNNER_TEMP/found" > "$RUNNER_TEMP/runs"
          hdiutil info > "$RUNNER_TEMP/disks.txt" || { echo "could not list the attached disk images"; red=1; }
          while read -r disk image; do
            if said=$(hdiutil detach -force "$disk" 2>&1 < /dev/null); then echo "detached $disk ($image)"; else echo "could not detach $disk ($image): $said"; kept+=("$image"); red=1; fi
          done < <(awk -v ws="$ws" 'FILENAME == ARGV[1] { under[$0 "/"] = 1; next } /^image-path/ { path = $0; sub(/^image-path *: */, "", path)
              ours = index(path, ws "/") == 1; for (folder in under) if (index(path, folder) == 1) ours = 1 }
            ours && /^\/dev\/disk[0-9]+[ \t]/ { print $1, path; ours = 0 }' "$RUNNER_TEMP/runs" "$RUNNER_TEMP/disks.txt")
          echo "$ws/release" >> "$RUNNER_TEMP/runs"
          while IFS= read -r folder; do
            [ -d "$folder" ] && [ ! -L "$folder" ] || continue
            for image in "${kept[@]}"; do case $image in "$folder"/*) echo "left $folder: it holds $image"; continue 2;; esac; done
            chmod -R u+rwx "$folder" 2> /dev/null || true
            if rm -rf "$folder"; then removed="$removed $folder"; else echo "could not remove $folder"; red=1; fi
          done < "$RUNNER_TEMP/runs"
          echo "removed:${removed:- nothing}"
          exit $red
