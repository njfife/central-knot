name: First-look Mac package
on:
  push:
    branches: [next]
  workflow_dispatch:
permissions:
  contents: read
# One runner: a newer push to the same branch replaces the run it made out of date.
concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mac:
    runs-on: [self-hosted, macOS, ARM64, ck-mac]
    timeout-minutes: 15
    steps:
      # An app left running by a cancelled or failed run would hold a debug port that this run could attach to.
      - run: pkill -f "$GITHUB_WORKSPACE/(release|node_modules/electron)/" || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:mac
      # The light tour: the packaged app opens and so does each page, one picture each (gh run download <run> -n light-tour).
      - run: node scripts/ui-tour.mjs light-tour
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: light-tour
          path: light-tour
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run e2e
      # A bundled build: the documented build command on a fixture marketplace, then the packaged build opened with the source gone.
      - run: node scripts/bundled-check.mjs
      # The alpha: packaged from a test alpha tag beside the standard app, then both opened on one throwaway home.
      - run: node scripts/alpha-check.mjs
