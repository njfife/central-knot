name: Mac checks on a hosted Mac
# The Mac run (scripts/mac-run.mjs, every check mac.yml runs) on GitHub's Apple-silicon Macs, started only by hand:
# gh workflow run mac-hosted.yml -R njfife/central-knot --ref <branch>. It is not the run that counts: mac.yml still is.
on:
  workflow_dispatch:
    inputs:
      groups_at_once:
        description: How many groups of end-to-end checks run at once (scripts/mac-run.mjs; 4 on the owner's Mac)
        default: '4'
      measure:
        description: Print results and exit 0 whatever the checks say (for measuring runs, off by default)
        type: boolean
        default: false
permissions:
  contents: read
# A group of its own: groups are shared by every workflow in the repository, so mac.yml's would let the two cancel each other.
concurrency:
  group: mac-hosted-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mac:
    # Apple silicon, 3 cores and 7 GB. A fresh machine: nothing left running by an earlier run to stop first, as mac.yml does.
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # Temporary folders, test homes and mounted disk images under /private/tmp, as on the owner's Mac.
      TMPDIR: /private/tmp
      CK_E2E_GROUPS_AT_ONCE: ${{ inputs.groups_at_once || '4' }}
    steps:
      # The machine, to compare runs by: cores, memory in bytes, macOS, the display.
      - run: sysctl -n hw.ncpu hw.memsize && sw_vers -productVersion && system_profiler SPDisplaysDataType | grep -i resolution || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      # The Electron zip the packaging downloads (Electron 45 has no install step), kept between runs for each Electron version.
      - id: electron
        run: echo "version=$(node -p "require('./package.json').devDependencies.electron")" >> "$GITHUB_OUTPUT"
      - id: electron-zip
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ steps.electron.outputs.version }}
      - run: npm ci
      # exec: a stop (cancellation) reaches the script itself, which sends it on to every part. A measuring run exits 0.
      - run: |
          if [ "${{ inputs.measure }}" = "true" ]; then node scripts/mac-run.mjs || true; else exec node scripts/mac-run.mjs; fi
      # The light tour's pictures: gh run download <run> -R njfife/central-knot -n light-tour.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: light-tour
          path: light-tour
          if-no-files-found: ignore
          retention-days: 7
      - if: always() && steps.electron-zip.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/Library/Caches/electron
          key: ${{ steps.electron-zip.outputs.cache-primary-key }}
