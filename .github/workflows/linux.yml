name: Linux package
# The Linux checks, split into jobs side by side: two unit-test shards (type check once), four end-to-end jobs (each packages
# its AppImage and runs one group of scripts/e2e.mjs; the shortest group also runs the smoke test and light tour), and one
# final job (`linux`) green only if every job passed. Nothing is released or uploaded but the light tour's pictures.
# Triggered on next, ci/** branches, and workflow_dispatch; never a required check for a Mac change yet (AGENTS.md).
on:
  push:
    branches: [next, 'ci/**']
  workflow_dispatch:
permissions:
  contents: read
# A group of its own: groups are shared by every workflow in the repository, so the Mac run's name would cancel Mac runs.
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # librarywalk.test.ts alone takes longer than all other 83 test files combined, so it gets shard 1 to itself and shard 2
      # runs the type check once plus every other tests/*.test.ts file.
      - if: matrix.shard == 1
        run: node --test tests/librarywalk.test.ts
      - if: matrix.shard == 2
        run: |
          npx tsc --noEmit
          shopt -s extglob
          node --test tests/!(librarywalk).test.ts

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      # A display for the app (Xvfb), FUSE for the AppImage to mount itself, and mksquashfs to make it.
      - run: dpkg -s xvfb fuse3 squashfs-tools >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb fuse3 squashfs-tools)
      - run: npm ci
      # Packaging in each e2e job (~13s) beats a separate package job + AppImage artifact hand-off (~61s before e2e can start).
      - run: npm run package:linux
      # Smoke test and light tour ride on group 4 (the shortest group by ~2½ minutes): no extra runner and zero critical-path cost.
      # Every launch passes --no-sandbox: Ubuntu 24.04 and later keep Chromium's sandbox from the user namespaces it needs.
      - if: matrix.group == 4
        run: xvfb-run -a release/Central-Knot-*-linux-x86_64.AppImage --smoke-test --no-sandbox
      # The light tour: the packaged app opens and so does each page, one picture each (gh run download <run> -n light-tour).
      - if: matrix.group == 4
        run: xvfb-run -a -s "-screen 0 1920x1200x24" node scripts/ui-tour.mjs light-tour --no-sandbox
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: (!cancelled()) && matrix.group == 4
        with:
          name: light-tour
          path: light-tour
          if-no-files-found: ignore
          retention-days: 7
      - run: xvfb-run -a -s "-screen 0 1920x1200x24" node scripts/e2e.mjs --group ${{ matrix.group }} --no-sandbox

  linux:
    needs: [unit, e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ needs.unit.result }} ${{ needs.e2e.result }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || exit 1; done
