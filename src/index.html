<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'">
  <title>Central Knot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="frame">
    <aside id="sidebar" aria-label="Central Knot">
      <div class="brand"><img class="logo" src="logo.svg" alt="" aria-hidden="true"><span class="wordmark">Central Knot</span></div>
      <nav id="nav" aria-label="Sections"></nav>
      <div id="homes" role="group" aria-label="Home being read"></div>
      <div id="sidebar-end"></div>
      <p id="update-news" class="visually-hidden" aria-live="polite"></p>
    </aside>
    <div id="main">
      <header id="header"></header>
      <main id="page"></main>
    </div>
  </div>
  <footer id="status">
    <div id="status-facts"></div>
    <div id="status-message"><p id="announcement" aria-live="polite"></p><button id="said-link" class="text-action" type="button" hidden></button><span id="message-mark" hidden></span></div>
    <div id="status-end"></div>
  </footer>
  <script type="module" src="renderer.js"></script>
</body>
</html>
